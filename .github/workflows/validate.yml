name: Validate game page

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shader-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint root HTML
        run: npm run lint
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/naga
          key: ${{ runner.os }}-naga-cli-30.0.1-v1
      - name: Install pinned Naga shader validator
        run: |
          if ! command -v naga >/dev/null 2>&1; then
            cargo install naga-cli --version 30.0.1 --locked
          fi
          naga --version
      - name: Check inline JS and compile WGSL
        run: npm run check
